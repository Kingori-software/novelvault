<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python in HTML - Interactive Demo</title>
    
    <!-- PyScript (latest stable as of mid-2026) -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
        }
        input, button {
            padding: 10px 16px;
            font-size: 16px;
            margin: 8px 4px 8px 0;
        }
        button {
            cursor: pointer;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
        }
        button:hover {
            background: #1d4ed8;
        }
        #result {
            margin-top: 20px;
            padding: 16px;
            background: #f1f5f9;
            border-radius: 8px;
            min-height: 60px;
        }
        #chart {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <h1>Python running inside HTML</h1>
    <p>Enter a number and click the button. Everything runs in your browser using Python.</p>

    <input type="number" id="numberInput" value="7" min="1" max="20">
    <button id="calcBtn">Calculate</button>

    <div id="result">Results will appear here...</div>
    <div id="chart"></div>

    <!-- Load matplotlib -->
    <py-config>
        packages = ["matplotlib", "numpy"]
    </py-config>

    <script type="py">
        from pyscript import when, display, document
        import math
        import numpy as np
        import matplotlib.pyplot as plt

        def factorial(n):
            return math.factorial(n)

        def fibonacci(n):
            seq = [0, 1]
            while len(seq) < n:
                seq.append(seq[-1] + seq[-2])
            return seq[:n]

        @when("click", "#calcBtn")
        def calculate(event):
            # Get the value from the input
            value = document.querySelector("#numberInput").value
            try:
                n = int(value)
                if n < 1 or n > 20:
                    display("Please enter a number between 1 and 20", target="result", append=False)
                    return
            except:
                display("Please enter a valid number", target="result", append=False)
                return

            # Python calculations
            fact = factorial(n)
            fib = fibonacci(n)

            # Show text results
            result_text = f"""
            <strong>Number:</strong> {n}<br>
            <strong>Factorial ({n}!):</strong> {fact}<br>
            <strong>First {n} Fibonacci numbers:</strong> {fib}
            """
            display(result_text, target="result", append=False)

            # Create a chart
            x = np.linspace(0, n, 100)
            y = np.sin(x) * np.exp(-x/10)   # nice looking wave

            fig, ax = plt.subplots(figsize=(7, 3.5))
            ax.plot(x, y, color="#2563eb", linewidth=2)
            ax.set_title(f"Sine wave damped (related to n = {n})")
            ax.set_xlabel("x")
            ax.set_ylabel("y")
            ax.grid(True, alpha=0.3)
            fig.tight_layout()

            display(fig, target="chart", append=False)
            plt.close(fig)
    </script>
</body>
</html>
