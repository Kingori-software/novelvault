<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Novel Vault — A Library for Book Lovers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@300..700&family=Crimson+Pro:ital,wght@0,300..700;1,300..700&family=Caveat:wght@400..700&family=Courier+Prime:ital,wght@0,400;1,400&family=Libre+Baskerville:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body class="dark">

<!-- ============================= LOGIN SCREEN ============================= -->
<section id="loginScreen" class="login-screen">

  <div class="login-bg">
    <span class="fb" style="--x:6%;  --d:0s;   --t:16s; --s:2.4rem;">📚</span>
    <span class="fb" style="--x:18%; --d:-4s;  --t:20s; --s:1.7rem;">📖</span>
    <span class="fb" style="--x:31%; --d:-9s;  --t:18s; --s:2rem;">📕</span>
    <span class="fb" style="--x:44%; --d:-2s;  --t:22s; --s:1.5rem;">📘</span>
    <span class="fb" style="--x:58%; --d:-12s; --t:17s; --s:2.2rem;">📗</span>
    <span class="fb" style="--x:71%; --d:-6s;  --t:21s; --s:1.8rem;">📙</span>
    <span class="fb" style="--x:84%; --d:-15s; --t:19s; --s:2.6rem;">📚</span>
    <span class="fb" style="--x:94%; --d:-8s;  --t:23s; --s:1.6rem;">📓</span>
    <div class="glow"></div>
  </div>

  <!-- Animated book-lover character -->
  <div class="geek-stage">
    <div class="geek" aria-hidden="true">
      <div class="hair"></div>
      <div class="head">
        <div class="glasses">
          <span class="lens"></span><span class="bridge"></span><span class="lens"></span>
        </div>
      </div>
      <div class="body"></div>
      <div class="book">
        <div class="page left"></div>
        <div class="page right"></div>
      </div>
    </div>
    <div class="sparkles" aria-hidden="true">
      <span>✦</span><span>✦</span><span>✦</span>
    </div>
  </div>

  <form class="login-card" id="loginForm" autocomplete="off">
    <h1 class="login-title">Novel&nbsp;Vault</h1>
    <p class="login-sub">A secret library for devoted book lovers</p>

    <label class="field">
      <span>Name</span>
      <input type="text" id="loginName" placeholder="Admin" autocomplete="username" />
    </label>

    <label class="field">
      <span>Password</span>
      <div class="pass-wrap">
        <input type="password" id="loginPass" placeholder="••••••••••••" autocomplete="current-password" />
        <button type="button" id="togglePass" class="ghost-btn" aria-label="Show password">👁</button>
      </div>
    </label>

    <p class="login-error" id="loginError"></p>

    <button type="submit" class="primary big">Enter the Library</button>

    <p class="login-quote">“A reader lives a thousand lives before he dies.”</p>
  </form>
</section>


<!-- ============================= MAIN APP ============================= -->
<div id="app" class="app hidden">

  <!-- Sliding quotes (homepage only) -->
  <div class="quotes-bar" aria-hidden="true">
    <div class="quotes-track" id="quotesTrack"></div>
  </div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">📖</span>
      <span class="brand-name">Novel Vault</span>
    </div>

    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="Toggle dark / light mode">🌙</button>
      <button class="primary" id="addNovelBtn">＋ Add Novel</button>
      <button class="icon-btn" id="logoutBtn" title="Log out">⏻</button>
    </div>
  </header>

  <main class="library">
    <div class="library-head">
      <h2>Your Shelf</h2>
      <p id="shelfCount" class="muted"></p>
    </div>

    <div class="book-grid" id="bookGrid"></div>

    <div class="empty-state hidden" id="emptyState">
      <div class="mini-geek">🤓📚</div>
      <p>Your shelf is empty. Tap <strong>＋ Add Novel</strong> to upload your first cover.</p>
    </div>
  </main>

  <div class="bg-floats" aria-hidden="true">
    <span>📚</span><span>📖</span><span>📕</span><span>📘</span><span>📗</span>
  </div>
</div>


<!-- ============================= READER ============================= -->
<div id="reader" class="reader hidden">
  <div class="reader-toolbar">
    <button class="icon-btn" id="readerBack" title="Back to library">←</button>
    <span class="reader-toolbar-title" id="toolbarTitle"></span>

    <div class="toolbar-controls">
      <select id="fontSelect" title="Font / handwriting style">
        <option value="georgia">Georgia (Serif)</option>
        <option value="palatino">Palatino (Postregol)</option>
        <option value="times">Times New Roman (Classic)</option>
        <option value="crimson">Crimson Pro (Book)</option>
        <option value="baskerville">Libre Baskerville</option>
        <option value="inter">Inter (Modern Sans)</option>
        <option value="verdana">Verdana (Easy Read)</option>
        <option value="courier">Courier (Typewriter)</option>
        <option value="caveat">Caveat (Handwriting)</option>
        <option value="italic">Italic Style</option>
      </select>

      <div class="size-ctrl">
        <button class="icon-btn" id="fontDown" title="Smaller text">A−</button>
        <button class="icon-btn" id="fontUp" title="Bigger text">A＋</button>
      </div>

      <div class="swatches" id="swatches">
        <button class="swatch brown"    data-theme="brown"      title="Brown page / black words"></button>
        <button class="swatch black"    data-theme="black"      title="Black page / white words"></button>
        <button class="swatch white"    data-theme="white"      title="White page / black words"></button>
        <button class="swatch whitebr"  data-theme="whitebrown" title="White page / brown words"></button>
        <button class="swatch sepia"    data-theme="sepia"      title="Sepia page"></button>
      </div>
    </div>
  </div>

  <div class="reader-scroll">
    <article class="reader-article" id="readerArticle" data-theme="sepia">
      <div class="reader-cover-wrap">
        <div class="reader-cover" id="readerCover"></div>
      </div>
      <h1 class="reader-title" id="readerTitle"></h1>
      <h2 class="reader-chapter" id="readerChapter"></h2>
      <div class="reader-content" id="readerContent"></div>

      <nav class="chapter-nav">
        <button class="ghost-btn" id="prevChapter">← Previous Chapter</button>
        <span id="chapterIndicator" class="muted"></span>
        <button class="ghost-btn" id="nextChapter">Next Chapter →</button>
      </nav>
    </article>
  </div>
</div>


<!-- ============================= MODAL ============================= -->
<div class="modal-backdrop hidden" id="modal">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Add Novel</h2>
      <button class="icon-btn" id="closeModal" title="Close">✕</button>
    </div>

    <div class="modal-body">
      <label class="field">
        <span>Book Title</span>
        <input type="text" id="fTitle" placeholder="THE DEVIL DOESN'T BARGAIN" />
      </label>

      <div class="grid-2">
        <label class="field">
          <span>Cover Image — Upload</span>
          <input type="file" id="fFile" accept="image/*" />
        </label>
        <label class="field">
          <span>Cover Image — Link (URL)</span>
          <input type="url" id="fUrl" placeholder="https://example.com/cover.jpg" />
        </label>
      </div>

      <div class="cover-preview" id="coverPreview">
        <span class="muted">Cover preview</span>
      </div>

      <div class="chapters-head">
        <h3>Chapters</h3>
        <button class="ghost-btn" id="addChapterBtn">＋ Add Chapter</button>
      </div>

      <div id="chaptersWrap" class="chapters-wrap"></div>
    </div>

    <div class="modal-actions">
      <button class="ghost-btn" id="cancelModal">Cancel</button>
      <button class="primary" id="saveNovel">Save Novel</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
